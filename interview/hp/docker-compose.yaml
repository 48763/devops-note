version: '3'
services:
  file:
    build:
      context: .
    image: file
    container_name: file
    restart: always
    logging:
      options:
        max-size: 50m
    ports:
      - 8080:80
    healthcheck:
      test: curl -fsS http://localhost:80/ || exit 1
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - sample
networks:
  sample:
